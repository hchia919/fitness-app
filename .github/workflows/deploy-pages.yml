name: 部署到 GitHub Pages

on:
  push:
    branches:
      - claude/personal-fitness-tracker-app-9prpbw
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 設定 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: enabled
      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 產物上傳完成後，Pages API 偶爾還查不到（上一次就是只差 0.4 秒就失敗），
      # 等幾秒再部署，避免這種偶發失敗。
      - name: 等待產物同步
        run: sleep 15
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
