<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <title>我的運動紀錄</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>我的運動紀錄</h1>
    <span id="today-label" class="today-label"></span>
  </header>

  <main>
    <!-- 紀錄頁 -->
    <section id="page-records" class="page active">
      <div id="record-list" class="record-list"></div>
      <p id="empty-hint" class="empty-hint hidden">
        還沒有任何紀錄。<br>點右下角「＋」新增第一筆運動紀錄吧！
      </p>
    </section>

    <!-- 統計頁 -->
    <section id="page-stats" class="page">
      <div class="stat-tiles">
        <div class="stat-tile">
          <span class="stat-label">本週次數</span>
          <span class="stat-value" id="stat-week-count">0</span>
          <span class="stat-unit">次</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">本週時間</span>
          <span class="stat-value" id="stat-week-minutes">0</span>
          <span class="stat-unit">分鐘</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">本週距離</span>
          <span class="stat-value" id="stat-week-distance">0</span>
          <span class="stat-unit">公里</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">連續天數</span>
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-unit">天</span>
        </div>
      </div>

      <div class="chart-card viz-root">
        <h2>近 7 天運動時間<span class="chart-sub">分鐘</span></h2>
        <div id="chart-week" class="chart"></div>
      </div>

      <div class="chart-card viz-root">
        <h2>近 30 天運動類型<span class="chart-sub">分鐘</span></h2>
        <div id="chart-types" class="chart"></div>
      </div>
    </section>

    <!-- 設定頁 -->
    <section id="page-settings" class="page">
      <div class="settings-card">
        <h2>資料備份</h2>
        <p class="settings-desc">所有紀錄都只儲存在這台裝置上，建議定期匯出備份。</p>
        <div class="settings-actions">
          <button id="btn-export" class="btn btn-secondary">匯出 JSON</button>
          <button id="btn-import" class="btn btn-secondary">匯入 JSON</button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </div>
      <div class="settings-card">
        <h2>清除資料</h2>
        <p class="settings-desc">刪除所有運動紀錄，此動作無法復原。</p>
        <div class="settings-actions">
          <button id="btn-clear" class="btn btn-danger">全部清除</button>
        </div>
      </div>
      <p class="about">我的運動紀錄 · 資料儲存於本機瀏覽器 · 可離線使用</p>
    </section>
  </main>

  <!-- 新增按鈕 -->
  <button id="fab" class="fab" aria-label="新增紀錄">＋</button>

  <!-- 底部分頁列 -->
  <nav class="tab-bar">
    <button class="tab active" data-page="page-records">
      <span class="tab-icon">📋</span>紀錄
    </button>
    <button class="tab" data-page="page-stats">
      <span class="tab-icon">📊</span>統計
    </button>
    <button class="tab" data-page="page-settings">
      <span class="tab-icon">⚙️</span>設定
    </button>
  </nav>

  <!-- 新增／編輯表單 -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <form id="record-form" class="modal-sheet">
      <h2 id="form-title">新增紀錄</h2>

      <label class="field">
        <span>日期</span>
        <input type="date" name="date" required>
      </label>

      <label class="field">
        <span>運動類型</span>
        <select name="type" required></select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>時間（分鐘）</span>
          <input type="number" name="minutes" min="1" max="1440" required placeholder="30">
        </label>
        <label class="field">
          <span>距離（公里）</span>
          <input type="number" name="distance" min="0" step="0.01" placeholder="選填">
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>卡路里（大卡）</span>
          <input type="number" name="calories" min="0" placeholder="選填">
        </label>
        <label class="field">
          <span>強度</span>
          <select name="intensity">
            <option value="輕鬆">輕鬆</option>
            <option value="適中" selected>適中</option>
            <option value="激烈">激烈</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>備註</span>
        <input type="text" name="note" maxlength="100" placeholder="今天感覺如何？（選填）">
      </label>

      <div class="modal-actions">
        <button type="button" id="btn-cancel" class="btn btn-secondary">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
